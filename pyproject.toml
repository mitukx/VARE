[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vare-rl"
version = "0.4.0"
description = "Verification-Aware Reinforcement Engine for closed-loop capability improvement"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "mitukx"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vare = "vare.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Syntax errors, undefined names, and a few pyflakes bug patterns.
# The default Ruff set still reports pre-existing unused imports and
# import-order findings, so CI gates this narrower set.
select = ["E9", "F63", "F7", "F82"]
