[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vare-rl"
version = "0.4.0"
description = "Verification-Aware Reinforcement Engine for closed-loop capability improvement"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "mitukx"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vare = "vare.entrypoint:main"

[tool.setuptools]
packages = ["vare", "vare.environments", "vare.integrations", "vare.learning_pipeline", "minigrpo", "selfimprove"]

[tool.setuptools.package-dir]
vare = "src/vare"
"vare.environments" = "src/vare/environments"
"vare.integrations" = "src/vare/integrations"
"vare.learning_pipeline" = "src/vare/learning_pipeline"
minigrpo = "minigrpo"
selfimprove = "selfimprove"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "minigrpo", "selfimprove"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "src"
follow_imports = "silent"
