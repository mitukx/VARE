name: grpo-metal-path-isolation-v4
# Completed v4 cohort; explicit dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal-path-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        precision: [fp32, bf16]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PRECISION: ${{ matrix.precision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned macOS runtime
        run: |
          grep -v '^mlx-cpu==' requirements/grpo-trajectory-cpu-test.txt > "$RUNNER_TEMP/path-requirements.txt"
          python -m pip install -e . -r "$RUNNER_TEMP/path-requirements.txt"
          python -m pip freeze > "$RUNNER_TEMP/path-environment.txt"
      - name: Verify small analytic controls
        run: python -m pytest -q tests/test_grpo_metal_path.py
      - name: Probe Metal
        id: backend
        run: |
          python scripts/diagnose_grpo_metal_path.py preflight --output "$RUNNER_TEMP/path-preflight.json"
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/path-preflight.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Download pinned model only on available backend
        if: steps.backend.outputs.status == 'READY'
        run: |
          python -c 'import subprocess,sys; subprocess.run([sys.executable,*sys.argv[1:]], check=True, timeout=180)' \
            scripts/diagnose_grpo_metal_path.py download --snapshot-path-file "$RUNNER_TEMP/snapshot-path.txt"
      - name: Isolate attention and projection with fixed targets
        if: steps.backend.outputs.status == 'READY'
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python -c 'import subprocess,sys; subprocess.run([sys.executable,*sys.argv[1:]], check=True, timeout=300)' \
            scripts/diagnose_grpo_metal_path.py run --snapshot "$(cat "$RUNNER_TEMP/snapshot-path.txt")" \
            --precision "$PRECISION" --output "$RUNNER_TEMP/path-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metal-path-v4-${{ matrix.precision }}
          path: |
            ${{ runner.temp }}/path-environment.txt
            ${{ runner.temp }}/path-preflight.json
            ${{ runner.temp }}/path-result.json
