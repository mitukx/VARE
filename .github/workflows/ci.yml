name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest==8.4.2
      # The default suite intentionally stays free of optional symbolic-math
      # dependencies. The isolated grader job below owns those tests.
      - run: python -m pytest --ignore=tests/test_math500_grader_v1.py --ignore=tests/test_math500_grader_v2.py
      # Frozen recomputations stay on one interpreter. The matrix above
      # covers the test suite; repeating the audits would not ask a new question.
      - name: Recompute and audit the exact GRPO identifiability witness
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_expected_update_audit_identifiability_v1.py
          python scripts/audit_grpo_expected_update_audit_identifiability_v1.py
      - name: Recompute and audit the exact GRPO audit-order characterization
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_audit_order_characterization_v1.py
          python scripts/audit_grpo_audit_order_characterization_v1.py
      - name: Recompute and audit the frozen partial GRPO audit cost study
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_partial_audit_estimator_v1.py
          python scripts/audit_grpo_partial_audit_estimator_v1.py
          python scripts/audit_grpo_partial_audit_summary_v1.py
      - name: Recompute and independently audit policy-shift GRPO sign risk
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_policy_shift_audit_risk_v1.py
          python scripts/audit_grpo_policy_shift_audit_risk_v1.py
      - name: Recompute and independently audit GRPO audit total-cost reduction
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_audit_cost_reduction_v1.py
          python scripts/audit_grpo_audit_cost_reduction_v1.py
      - name: Run the deterministic demo
        if: matrix.python-version == '3.11'
        run: vare demo --rounds 4 --rollouts 256 --seed 7 --output artifacts/demo.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python-version == '3.11'
        with:
          name: vare-demo
          path: artifacts/demo.json
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.12
      - run: ruff check src tests
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install mypy==1.19.1
      - run: mypy src/vare
  math500-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated CPU checker dependencies
        run: python -m pip install -r requirements/math500-grader-test.lock.txt
      - name: Run independent mathematical grader tests
        run: python -m pytest tests/test_math500_grader_v1.py tests/test_math500_grader_v2.py
