name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest
      - run: vare demo --rounds 4 --rollouts 256 --seed 7 --output artifacts/demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: vare-demo
          path: artifacts/demo.json
