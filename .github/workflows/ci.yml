name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  seeded-summary-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest==8.4.2
      - name: Reproduce frozen and seed-aware estimands
        run: >-
          python scripts/reproduce_seeded_summary_v3.py
          --output "${RUNNER_TEMP}/seeded-summary-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seeded-summary-replay
          path: ${{ runner.temp }}/seeded-summary-replay
      - name: Audit the retained comparison record without model execution
        run: >-
          python scripts/reproduce_format_comparison_record_v1.py
          --output "${RUNNER_TEMP}/format-record-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: format-record-replay
          path: ${{ runner.temp }}/format-record-replay
  rvl-inference-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/rvl-inference-cpu-test.txt
      - name: Check rollback and inference state contracts
        run: >-
          python -m pytest tests/test_rvl_grpo_torch_state.py
          tests/test_rvl_grpo_inference_cancellation.py
          tests/test_rvl_grpo_shared_module_mode.py
      - name: Compare pinned main, alias correction, and inference correction
        run: >-
          python scripts/reproduce_rvl_inference_transaction_v1.py
          --output "${RUNNER_TEMP}/rvl-inference-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rvl-inference-cpu-replay
          path: ${{ runner.temp }}/rvl-inference-replay
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" pytest==8.4.2
      - name: Pull the pinned amd64 image for isolated candidate tests
        run: docker pull python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      # The default suite intentionally stays free of optional symbolic-math
      # dependencies. The isolated grader job below owns those tests.
      - run: python -m pytest --ignore=tests/test_math500_grader_v1.py --ignore=tests/test_math500_grader_v2.py
        env:
          VARE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/durable-test-diagnostics
          VARE_RUN_AUTHORED_MLSYS_ISOLATION_TESTS: ${{ matrix.python-version == '3.12' && '1' || '0' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: durable-test-diagnostics-${{ matrix.python-version }}
          path: ${{ runner.temp }}/durable-test-diagnostics
          if-no-files-found: ignore
      - name: Reproduce whole-round ownership and restart fencing
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_runtime_round_ownership_v1.py
          --output "${RUNNER_TEMP}/runtime-round-replay"
      - name: Reproduce bounded checkpoint IO and evaluator recovery
        if: matrix.python-version == '3.12'
        run: |
          python scripts/reproduce_checkpoint_read_bounds_v1.py --output "${RUNNER_TEMP}/checkpoint-io-replay"
          python scripts/audit_checkpoint_read_bounds_v1.py "${RUNNER_TEMP}/checkpoint-io-replay"
          python -O scripts/audit_checkpoint_read_bounds_v1.py "${RUNNER_TEMP}/checkpoint-io-replay"
      - name: Reproduce grader owner loss and durable resume
        if: matrix.python-version == '3.12'
        run: |
          python scripts/reproduce_grader_owner_loss_v1.py --output "${RUNNER_TEMP}/grader-owner-loss-replay"
          python scripts/audit_grader_owner_loss_v1.py "${RUNNER_TEMP}/grader-owner-loss-replay"
          python -O scripts/audit_grader_owner_loss_v1.py "${RUNNER_TEMP}/grader-owner-loss-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: grader-owner-loss-replay
          path: ${{ runner.temp }}/grader-owner-loss-replay
      - name: Reproduce durable executor source pinning and restored resume
        if: matrix.python-version == '3.12'
        run: |
          python scripts/reproduce_durable_runtime_source_v1.py --output "${RUNNER_TEMP}/durable-runtime-source-replay"
          python scripts/audit_durable_runtime_source_v1.py "${RUNNER_TEMP}/durable-runtime-source-replay"
          python -O scripts/audit_durable_runtime_source_v1.py "${RUNNER_TEMP}/durable-runtime-source-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: durable-runtime-source-replay
          path: ${{ runner.temp }}/durable-runtime-source-replay
      - name: Reproduce trajectory capture policy and lifetime boundaries
        if: matrix.python-version == '3.12'
        run: |
          python scripts/reproduce_trajectory_capture_boundary_v1.py --output "${RUNNER_TEMP}/trajectory-capture-replay"
          python scripts/audit_trajectory_capture_boundary_v1.py "${RUNNER_TEMP}/trajectory-capture-replay"
          python -O scripts/audit_trajectory_capture_boundary_v1.py "${RUNNER_TEMP}/trajectory-capture-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: trajectory-capture-replay
          path: ${{ runner.temp }}/trajectory-capture-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: checkpoint-io-replay
          path: ${{ runner.temp }}/checkpoint-io-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: runtime-round-replay
          path: ${{ runner.temp }}/runtime-round-replay
      - name: Reproduce owned evaluation task cleanup
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_engine_evaluation_lifecycle_v1.py
          --output "${RUNNER_TEMP}/engine-evaluation-replay"
      - name: Reproduce cancellation-safe evaluation interlock rollback
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_engine_evaluation_interlock_integration_v1.py
          --output "${RUNNER_TEMP}/engine-interlock-replay"
      - name: Reproduce candidate-discard restoration and fail-closed reentry
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_candidate_discard_recovery_v1.py
          --output "${RUNNER_TEMP}/candidate-discard-replay"
      - name: Reproduce runtime promotion acknowledgment and recovery fence
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_promotion_publication_recovery_v1.py
          --output "${RUNNER_TEMP}/promotion-publication-replay"
      - name: Reproduce promotion cancellation ownership
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/reproduce_promotion_cancellation_ownership_v1.py
          --output "${RUNNER_TEMP}/promotion-cancellation-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: promotion-publication-replay
          path: ${{ runner.temp }}/promotion-publication-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: promotion-cancellation-replay
          path: ${{ runner.temp }}/promotion-cancellation-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: candidate-discard-replay
          path: ${{ runner.temp }}/candidate-discard-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: engine-interlock-replay
          path: ${{ runner.temp }}/engine-interlock-replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: engine-evaluation-replay
          path: ${{ runner.temp }}/engine-evaluation-replay
      # Frozen recomputations stay on one interpreter. The matrix above
      # covers the test suite; repeating the audits would not ask a new question.
      - name: Recompute and audit the exact GRPO identifiability witness
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_expected_update_audit_identifiability_v1.py
          python scripts/audit_grpo_expected_update_audit_identifiability_v1.py
      - name: Recompute and audit the exact GRPO audit-order characterization
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_audit_order_characterization_v1.py
          python scripts/audit_grpo_audit_order_characterization_v1.py
      - name: Independently reproduce the frozen GRPO audit-order witness
        if: matrix.python-version == '3.11'
        run: >-
          python scripts/reproduce_grpo_audit_independent_reproduction_v2.py
          --output ${{ runner.temp }}/grpo-audit-independent-reproduction-v2.json
      - name: Recompute and audit the frozen partial GRPO audit cost study
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_partial_audit_estimator_v1.py
          python scripts/audit_grpo_partial_audit_estimator_v1.py
          python scripts/audit_grpo_partial_audit_summary_v1.py
      - name: Recompute and independently audit policy-shift GRPO sign risk
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_policy_shift_audit_risk_v1.py
          python scripts/audit_grpo_policy_shift_audit_risk_v1.py
      - name: Recompute and independently audit GRPO audit total-cost reduction
        if: matrix.python-version == '3.11'
        run: |
          python scripts/run_grpo_audit_cost_reduction_v1.py
          python scripts/audit_grpo_audit_cost_reduction_v1.py
      - name: Run the deterministic demo
        if: matrix.python-version == '3.11'
        run: vare demo --rounds 4 --rollouts 256 --seed 7 --output artifacts/demo.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python-version == '3.11'
        with:
          name: vare-demo
          path: artifacts/demo.json
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.12
      - run: ruff check src tests minigrpo selfimprove scripts/run_minigrpo.py scripts/run_selfimprove.py scripts/run_flagship.py scripts/reproduce_grpo_audit_independent_reproduction_v2.py scripts/validate_grpo_e2e_cpu.py scripts/audit_grpo_e2e_cpu.py scripts/benchmark_trajectory_runtime.py scripts/audit_trajectory_runtime.py scripts/validate_streamed_grpo_cpu.py scripts/audit_streamed_grpo_cpu.py scripts/benchmark_verifier_refresh_controls.py
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install mypy==1.19.1
      - run: mypy src/vare
  blob-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python scripts/check_tracked_blob_budget.py
  math500-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated CPU checker dependencies
        run: python -m pip install -r requirements/math500-grader-test.lock.txt
      - name: Run independent mathematical grader tests
        run: python -m pytest tests/test_math500_grader_v1.py tests/test_math500_grader_v2.py
