name: bootstrap-vare
on:
  push:
    paths:
      - '.vare-bootstrap.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack tracked repository tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .vare-bootstrap.ready ]]; then
            echo "bootstrap sentinel absent; nothing to do"
            exit 0
          fi
          test -f .vare-bootstrap.part-00
          test -f .vare-bootstrap.part-01
          test -f .vare-bootstrap.part-02
          test -f .vare-bootstrap.part-03
          cat .vare-bootstrap.part-* | base64 -d | tar -xzf -
          rm .vare-bootstrap.ready .vare-bootstrap.part-*
      - name: Commit imported tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Import VARE v0.3.1"
          git push origin HEAD:main
