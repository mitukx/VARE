name: trl-8520-source-replay
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'protocols/trl_8520_environment_column_source_v1.json'
      - 'scripts/reproduce_trl_8520_environment_column.py'
      - 'tests/test_trl_8520_environment_column.py'
      - '.github/workflows/trl-8520-source-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_trl_8520_environment_column.py
      - run: timeout 120s python scripts/reproduce_trl_8520_environment_column.py --output "$RUNNER_TEMP/source-replay.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trl-8520-source-replay
          path: ${{ runner.temp }}/source-replay.json
