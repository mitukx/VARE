name: verified-rollout-preflight
on:
  pull_request:
    paths:
      - src/vare/learning_pipeline/verified_rollout_replay.py
      - tests/test_vare_ig_verified_rollout_replay.py
      - .github/workflows/verified-rollout-preflight.yml
permissions:
  contents: read
jobs:
  preflight-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest==8.4.2
      - name: Verify rollout preflight regression
        run: python -m pytest -q tests/test_vare_ig_verified_rollout_replay.py
