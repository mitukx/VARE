name: cpu-evidence

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - 'benchmarks/historical/**'
      - 'benchmarks/regressions/**'
      - 'benchmarks/audits/**'
      - 'scripts/**'
      - 'vare/**'
      - 'src/vare/**'
      - 'tests/**'
      - 'benchmarks/scheduler/**'
      - 'protocols/**'
      - 'results/**'
      - '.github/workflows/cpu-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrated-cpu-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check evaluation execution contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_runner.py' -v
          python3 -m unittest discover -s tests -p 'test_durable.py' -v
          python3 -m unittest discover -s tests -p 'test_measurement.py' -v
      - name: Reconstruct retained systems evidence
        run: |
          python3 scripts/audit_scheduler.py results/cpu-scheduler-v1
          python3 scripts/audit_recovery.py results/cpu-recovery-v1
      - name: Calibrate the HF behavior-policy task
        run: >-
          python3 scripts/calibrate_task.py
          --output "${RUNNER_TEMP}/vare-rvl-calibration"
      - name: Calibrate the TRL accumulation-window task
        run: >-
          python3 scripts/calibrate_task.py
          --task-root benchmarks/historical/trl_grpo_accumulation_scale
          --output "${RUNNER_TEMP}/vare-trl-calibration"
      - name: Calibrate locked-input tamper rejection
        run: >-
          python3 scripts/calibrate_integrity.py
          --output "${RUNNER_TEMP}/vare-integrity-calibration"
      - name: Rebuild current frozen regression calibrations
        run: >-
          python3 scripts/calibrate_regressions.py
          --output-root "${RUNNER_TEMP}/vare-current-regression-calibrations"
      - name: Audit retained regression evidence against fresh replays
        run: >-
          python3 scripts/audit_regression_evidence.py
          --regenerated-root "${RUNNER_TEMP}/vare-current-regression-calibrations"
      - name: Check synthetic preference objective and gradient
        run: python3 -m unittest discover -s tests -p 'test_synthetic_dpo.py' -v
      - name: Run frozen synthetic CPU preference experiment
        run: >-
          python3 scripts/run_synthetic_dpo.py
          --output "${RUNNER_TEMP}/vare-synthetic-dpo-cpu"
      - name: Audit synthetic preference experiment bundle
        run: >-
          python3 scripts/audit_synthetic_dpo.py
          "${RUNNER_TEMP}/vare-synthetic-dpo-cpu"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vare-current-regression-calibrations
          path: ${{ runner.temp }}/vare-current-regression-calibrations
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vare-synthetic-dpo-cpu
          path: ${{ runner.temp }}/vare-synthetic-dpo-cpu
          if-no-files-found: error
          retention-days: 30
