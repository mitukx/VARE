name: replay-fullpath-benchmark

on:
  pull_request:
    paths:
      - src/vare/replay.py
      - benchmarks/replay_sampling_fullpath_v1.py
      - .github/workflows/replay-fullpath-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fullpath-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install VARE
        run: python -m pip install -e .
      - name: Compare full grouped-replay paths
        run: |
          python benchmarks/replay_sampling_fullpath_v1.py \
            --output "${RUNNER_TEMP}/replay-fullpath.json" --repeats 11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-fullpath-benchmark
          path: ${{ runner.temp }}/replay-fullpath.json
          if-no-files-found: error
