name: grpo-pretrained-sampling-alignment
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/diagnose_grpo_pretrained_sampling.py'
      - 'protocols/grpo_pretrained_sampling_alignment_v1.json'
      - '.github/workflows/grpo-pretrained-sampling-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretrained-sampling-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arm: [fp32, bf16, q4]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned MLX CPU runtime
        run: |
          python -m pip install -e . -r requirements/grpo-trajectory-cpu-test.txt
          python -m pip freeze > "${RUNNER_TEMP}/alignment-environment.txt"
      - name: Download and verify the pinned public checkpoint
        run: >-
          timeout 180s python scripts/diagnose_grpo_pretrained_sampling.py download
          --snapshot-path-file "${RUNNER_TEMP}/snapshot-path.txt"
      - name: Measure sampled and differentiated scores without updating weights
        env:
          HF_HUB_OFFLINE: '1'
          ARM: ${{ matrix.arm }}
        run: |
          timeout 480s python scripts/diagnose_grpo_pretrained_sampling.py run \
            --snapshot "$(cat "${RUNNER_TEMP}/snapshot-path.txt")" \
            --arm "$ARM" --device cpu --output "${RUNNER_TEMP}/alignment-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pretrained-alignment-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/alignment-environment.txt
            ${{ runner.temp }}/alignment-result.json
